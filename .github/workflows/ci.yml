name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install tools
        run: |
          # Go tools
          go install github.com/jstemmer/go-junit-report/v2@latest
          go install golang.org/x/tools/cmd/goimports@latest

          # golangci-lint v2.x (for make lint - matches local version)
          #
          # Installed via `go install` instead of the official install.sh: that
          # script's checksum lookup (`grep "${BASENAME}" checksums.txt`) is
          # unanchored, and v2.12.2's checksums.txt added a
          # golangci-lint-<ver>-linux-amd64.tar.gz.sbom.json sidecar entry whose
          # name is a superstring of the real tarball's name. grep matches both
          # lines, so the expected-hash lookup returns two concatenated hashes
          # and verification always fails, even though the download itself is
          # fine. Tracked upstream: no fix merged as of this writing.
          #
          # GOTOOLCHAIN=go1.25.12 matches the Go version upstream's official
          # v2.12.2 release binaries are built with (see the GOTOOLCHAIN scoping
          # in the Makefile's lint target), so this build stays equivalent to
          # the release binary the install.sh would have fetched.
          GOTOOLCHAIN=go1.25.12 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

          # pre-commit (gitleaks installed automatically by pre-commit)
          pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run tests with coverage
        # pdcore and plugins/web/echo are separate Go modules (the plugin has
        # its own go.mod with a replace back to pdcore), so there is no single
        # `make test-ci-cov` target — each module's coverage.out/test-results.xml
        # stays scoped to its own directory and can't be merged by concatenation
        # across the module boundary. Run both explicitly.
        run: |
          make test-ci-cov-core
          make test-ci-cov-plugins

      - name: Test Results
        # Required status check (see repo ruleset "PR merge requirements",
        # which requires a check literally named "Test Results"). Covers
        # both modules combined so this one check gates the merge. Per-module
        # numbers for the PR comment are parsed locally below instead of
        # running this action a second/third time per module — the action
        # already generates a real GitHub check run as a side effect of each
        # invocation, so a second run would create a second, redundant check.
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/test-results.xml'
          check_name: Test Results
          comment_mode: off

      - name: Build combined test results comment
        # Parses each module's JUnit XML directly (go-junit-report's
        # <testsuites><testsuite tests= failures= errors= .../></testsuites>
        # format) to get per-module counts, rather than invoking the action
        # above again per module.
        if: always()
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET

          def summarize(path):
              root = ET.parse(path).getroot()
              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
              tests = failures = errors = skipped = 0
              duration = 0.0
              for s in suites:
                  tests += int(s.get("tests", 0))
                  failures += int(s.get("failures", 0))
                  errors += int(s.get("errors", 0))
                  skipped += int(s.get("skipped", 0))
                  duration += float(s.get("time", 0))
              passed = tests - failures - errors - skipped
              status = "✅" if failures == 0 and errors == 0 else "❌"
              return f"**{tests} tests** — {passed} passed, {failures} failed, {errors} errors, {skipped} skipped ({duration:.1f}s) {status}"

          with open("test-results-comment.md", "w") as f:
              f.write("## Test Results\n\n")
              f.write("### pdcore\n")
              f.write("Core validation library.\n\n")
              f.write(summarize("pdcore/test-results.xml") + "\n\n")
              f.write("### plugins/web/echo\n")
              f.write("Echo framework Binder integration.\n\n")
              f.write(summarize("plugins/web/echo/test-results.xml") + "\n")
          PYEOF

      - name: Add test results PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          header: test-results
          recreate: true
          path: test-results-comment.md

      - name: Generate coverage report
        # The coverage badge/threshold gate (used for the "Update coverage
        # badge" step below) tracks pdcore only, matching the 90%/96%
        # thresholds tuned before the pdcore/plugins module split.
        #
        # The PR comment itself covers BOTH modules: pdcore's table is
        # generated from the repo root (its module), and the plugin's table
        # is generated with cwd inside plugins/web/echo, since `go tool
        # cover -func` resolves each profile's packages via that package's
        # OWN module — it can't see plugins/web/echo's packages from pdcore's
        # module root (nested go.mod dirs aren't part of the parent module's
        # package graph). Both reports are appended into one comment file.
        run: |
          chmod +x .github/scripts/coverage-report.sh
          .github/scripts/coverage-report.sh pdcore/coverage.out pdcore-coverage-results.md 90 96
          (cd plugins/web/echo && "$GITHUB_WORKSPACE/.github/scripts/coverage-report.sh" coverage.out "$GITHUB_WORKSPACE/plugin-coverage-results.md" 90 96)
          {
            echo "## Code Coverage"
            echo ""
            echo "### pdcore"
            echo "Core validation library."
            echo ""
            cat pdcore-coverage-results.md
            echo ""
            echo "### plugins/web/echo"
            echo "Echo framework Binder integration."
            echo ""
            cat plugin-coverage-results.md
          } > code-coverage-results.md

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: coverage
          recreate: true
          path: code-coverage-results.md

      - name: Extract coverage percentage
        if: github.ref == 'refs/heads/main'
        id: coverage
        run: |
          COVERAGE=$(cat coverage.txt | sed 's/%//')
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: pedantigo-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.COVERAGE }}%
          valColorRange: ${{ steps.coverage.outputs.COVERAGE }}
          maxColorRange: 100
          minColorRange: 0
