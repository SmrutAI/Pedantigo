# Pre-commit hooks configuration for Pedantigo
#
# Setup:
#   brew install pre-commit (or pip install pre-commit)
#   pre-commit install
#
# Usage:
#   pre-commit run --all-files              # Run all hooks
#   pre-commit run <hook-id>                # Run specific hook
#
# To skip hooks temporarily:
#   git commit --no-verify -m "message"
#
# Hook execution order:
#   1. Security (gitleaks)
#   2. Go styling (go-fmt, go-vet, golangci-lint)
#   3. Go build
#   4. Go tests (fast for library)

repos:
  # ============================================
  # 1. SECURITY HOOKS (run first)
  # ============================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ============================================
  # 2. GO STYLING HOOKS (before build)
  # ============================================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt

  # ============================================
  # 3-5. CUSTOM LOCAL HOOKS
  # Each action (vet, lint, build, tests) has two separate hooks: -core runs
  # first, -plugins runs after. All four core hooks run to completion before
  # any plugin hook starts — pre-commit stops at the first failing hook, so
  # every core issue is resolved before plugins are checked at all.
  # ============================================
  - repo: local
    hooks:
      # --- CORE (pdcore) — runs first ---

      - id: go-vet-core
        name: Go vet (core)
        description: Runs make vet-core
        entry: make vet-core
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint-core
        name: golangci-lint (core)
        description: Runs make lint-core
        entry: make lint-core
        language: system
        types: [go]
        pass_filenames: false

      - id: check-build-core
        name: Go build check (core)
        description: Runs make build-core
        entry: make build-core
        language: system
        types: [go]
        pass_filenames: false

      - id: check-tests-core
        name: Run Go tests (core)
        description: Runs make test-coverage-core
        entry: make test-coverage-core
        language: system
        types: [go]
        pass_filenames: false

      # --- PLUGINS — runs after all core hooks pass ---

      - id: go-vet-plugins
        name: Go vet (plugins)
        description: Runs make vet-plugins
        entry: make vet-plugins
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint-plugins
        name: golangci-lint (plugins)
        description: Runs make lint-plugins
        entry: make lint-plugins
        language: system
        types: [go]
        pass_filenames: false

      - id: check-build-plugins
        name: Go build check (plugins)
        description: Runs make build-plugins
        entry: make build-plugins
        language: system
        types: [go]
        pass_filenames: false

      - id: check-tests-plugins
        name: Run Go tests (plugins)
        description: Runs make test-coverage-plugins
        entry: make test-coverage-plugins
        language: system
        types: [go]
        pass_filenames: false